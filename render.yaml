services:
  - type: web
    name: myfund-portfolio-mcp
    runtime: python
    plan: free
    rootDir: myfund-mcp
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: MYFUND_API_KEY
        sync: false
      - key: MCP_ACCESS_TOKEN
        sync: false
